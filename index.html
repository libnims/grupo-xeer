<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grupo Xeer Empresarial | Holding Corporativo de Costa Rica</title>
    <meta name="description" content="Holding empresarial en Costa Rica que impulsa el éxito corporativo a través de sus divisiones TALENPRO, Xeer Escuela de Negocios y Xeer Wellness Group.">
    <meta name="keywords" content="Grupo Xeer, holding empresarial Costa Rica, TALENPRO, escuela de negocios San Jose, Xeer Wellness, consultoría corporativa">
    <meta name="robots" content="index, follow">
    <meta name="author" content="Grupo Xeer Empresarial">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Grupo Xeer Empresarial | Holding Corporativo de Costa Rica">
    <meta property="og:description" content="Innovamos, Formamos y Transformamos empresas. Conozca nuestras divisiones de consultoría, negocios y bienestar integral.">
    <meta property="og:image" content="https://grupoxeer.com"> 
    <meta property="og:url" content="https://grupoxeer.com">
    <link rel="icon" type="image/png" href="img/logo-gxeer.PNG">
    <link rel="stylesheet" href="css/index.css">
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>
    <section class="pantalla-organigrama">
    
       
        <!-- Esquina Superior Derecha -->
        <svg class="adorno-svg sup-der" viewBox="0 0 200 120" preserveAspectRatio="none">
            <defs>
                <linearGradient id="gradDorado" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#C59B27" />
                    <stop offset="100%" stop-color="#EAD183" />
                </linearGradient>
            </defs>
            <path d="M 0 0 L 200 0 L 200 120 C 170 80, 110 50, 0 0 Z" fill="#011627" />
            <path d="M 40 0 C 120 30, 170 60, 190 120" fill="none" stroke="url(#gradDorado)" stroke-width="3" opacity="0.8"/>
            <path d="M 90 0 C 140 25, 175 55, 185 120 L 200 120 L 200 0 Z" fill="#0A3654" opacity="0.2" />
        </svg>

        <!-- Esquina Inferior Izquierda -->
        <svg class="adorno-svg inf-izq" viewBox="0 0 200 120" preserveAspectRatio="none">
            <path d="M 0 0 C 90 70, 150 100, 200 120 L 0 120 Z" fill="#011627" />
            <path d="M 0 20 C 70 60, 120 85, 180 120" fill="none" stroke="url(#gradDorado)" stroke-width="3" opacity="0.8"/>
        </svg>

        <!-- Contenedor Principal Centrado -->
        <div class="organigrama-container">
            
            <!-- Logo Principal Superior con Animación 3D Controlada -->
            <div class="main-logo-top">
                <img src="img/logo-gxeer.index.png" alt="Logo Grupo Xeer">
            </div>

            <!-- Bloque Superior de Introducción -->
            <div class="introduction">
                <h1>
                    <span class="grande">GRUPO XEER</span>
                    <span class="pequeño">EMPRESARIAL DE COSTA RICA</span> 
                </h1>
                <div class="divisor">
                    <div class="linea"></div>
                    <div class="circulo"></div>
                    <div class="linea"></div>
                </div>
                <p class="holding">HOLDING EMPRESARIAL</p>
            </div>

            <!-- Grid de las 4 Tarjetas de Empresas Principales -->
            <div class="grid-empresas">

                <!-- Tarjeta 1: Talenpro -->
                <a href="talenpro-index.html" class="enlace-tarjeta">
                    <div class="tarjeta-empresa bg-verde">
                        <div class="icono-circular"><img src="img/talenpro.PNG" alt=""></div>
                        <div class="texto-tarjeta">
                            <span class="titulo-tarjeta">TALENPRO</span>
                            <span class="subtitulo-tarjeta">(Training & Consulting)</span>
                        </div>
                    </div>
                </a>

                <!-- Tarjeta 2: Xeer Enterprise -->
                <a href="outsourcing-index.html" class="enlace-tarjeta">
                    <div class="tarjeta-empresa bg-verde">
                        <div class="icono-circular"><img src="img/servicio.PNG" alt=""></div>
                        <div class="texto-tarjeta">
                            <span class="titulo-tarjeta">XEER ENTERPRISE OUTSOURCING</span>
                        </div>
                    </div>
                </a>

                <!-- Tarjeta 3: Xeer Escuela de Negocios -->
                <a href="escuela.html" class="enlace-tarjeta">
                    <div class="tarjeta-empresa bg-verde">
                        <div class="icono-circular"><img src="img/escuela.PNG" alt=""></div>
                        <div class="texto-tarjeta">
                            <span class="titulo-tarjeta">XEER ESCUELA DE NEGOCIOS</span>
                        </div>
                    </div>
                </a>

                <!-- Tarjeta 4: Enlace Interno que activa el despliegue del Wellness Group -->
                <a href="xeer-wellness-group-index.html" class="enlace-tarjeta">
                    <div class="tarjeta-empresa bg-verde">
                        <div class="icono-circular"><img src="img/wellness.PNG" alt=""></div>
                        <div class="texto-tarjeta">
                            <span class="titulo-tarjeta">XEER WELLNESS GROUP</span>
                        </div>
                    </div>
                </a>
            </div>

            <!-- Valores Inferiores Estilo Premium -->
            <div class="valores-footer">
                <div class="valor-item"><img class="icono-valor v-1" src="img/innovamos.PNG" alt="">INNOVAMOS</div>
                <div class="separador-vertical">|</div>
                <div class="valor-item"><img class="icono-valor v-2" src="img/formamos.PNG" alt="">FORMAMOS</div>
                <div class="separador-vertical">|</div>
                <div class="valor-item"><img class="icono-valor v-3" src="img/transformamos.PNG" alt=""> TRANSFORMAMOS</div>
            </div>

        </div>

        <!-- Barra Inferior de Cierre Re-diseñada -->
        <footer class="barra-footer">
            <p class="footer-p1">UN SOLO GRUPO, MÚLTIPLES SOLUCIONES.</p>
            <p class="footer-p2">MAYOR VALOR PARA PERSONAS, PROFESIONALES Y EMPRESAS.</p>
        </footer>
    </section>
</body>
</html>
